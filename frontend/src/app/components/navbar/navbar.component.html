<div class="row align-items-center mt-3 custom-navbar">
    <div class="col-md-7 col-lg-8">
        <div class="input-group" *ngIf="!title">
            <span class="input-group-text custom-input">
                <ion-icon name="search-outline" class="fw-bold fs-4"></ion-icon>
            </span>
            <input type="text" class="form-control custom-input shadow-none" placeholder="Search snippet"
                [(ngModel)]="searchSnippet" (ngModelChange)="snippetService.searchingSnippets(searchSnippet)">
        </div>

        <div class="d-flex align-items-center" *ngIf="title">
            <button class="d-flex" aria-label="go back to snippets">
                <ion-icon name="arrow-back" class="text-light btn-icon fs-4 me-2" (click)="back()"></ion-icon>
            </button>
            <h1 class="text-light fs-5 fw-bold m-0">{{ title }}</h1>
        </div>
    </div>

    <div class="col">
        <div class="d-flex align-items-center justify-content-end">
            <app-notification></app-notification>
            <ion-icon *ngIf="user.role === ROLE.ROLE_ADMIN" name="shield-outline" class="text-light me-2 fs-4 btn-icon" routerLink="/admin-dashboard"></ion-icon>
            <ion-icon class="text-light me-2 fs-4 btn-icon" name="log-out-outline" (click)="logout()"></ion-icon>
            <app-profil></app-profil>
        </div>
    </div>
</div>
